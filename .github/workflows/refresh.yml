name: Refresh

# 하루 두 번. 21:30 UTC = 한국 06:30, 09:30 UTC = 한국 18:30.
# Must Read는 여기서 쓰지 않습니다. 11분 뒤 Claude 예약 작업이 이 피드를 읽고 씁니다 (docs/MUSTREAD.md).
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: '아침판이면 10가지 브리핑도 씁니다(API 키가 있을 때). 비우면 실행 시각으로 정합니다'
        type: choice
        options: ['', morning, evening]
        default: ''

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run feed

      - name: Pick edition
        id: edition
        env:
          INPUT: ${{ inputs.edition }}
        run: |
          if [ -n "$INPUT" ]; then
            echo "name=$INPUT" >> "$GITHUB_OUTPUT"
          else
            # 한국 시간 정오 전이면 아침판입니다.
            h=$(TZ=Asia/Seoul date +%H)
            if [ "$h" -lt 12 ]; then echo "name=morning" >> "$GITHUB_OUTPUT"; else echo "name=evening" >> "$GITHUB_OUTPUT"; fi
          fi

      # 키가 없으면 건너뛰고, 실패해도 피드 커밋은 막지 않습니다.
      - name: Morning brief (10 items)
        if: steps.edition.outputs.name == 'morning'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run brief

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain public/data)" ]; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r public/data "$RUNNER_TEMP/data"
          for attempt in 1 2 3; do
            git add public/data
            git commit -q -m "Refresh feed (${{ steps.edition.outputs.name }})" || true
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            # 그사이 브랜치가 움직였으면 최신 위에 생성물만 다시 얹습니다.
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            cp -r "$RUNNER_TEMP/data/." public/data/
          done
          exit 1
